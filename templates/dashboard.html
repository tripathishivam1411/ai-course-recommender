<!DOCTYPE html>
<html>
<head>
<title>Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='loader.css') }}">

<script>
function showLoader() {
  document.getElementById("loader").style.display = "block";
}
</script>

</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
<div class="container-fluid">
<span class="navbar-brand">AI Recommender</span>
<a href="/logout" class="btn btn-danger">Logout</a>
</div>
</nav>

<div class="container mt-5">

<h3>Welcome, {{ user }}</h3>

<form method="POST" onsubmit="showLoader()">
<div class="mb-3">
<textarea name="interest" class="form-control"
placeholder="Enter your interest..." required></textarea>
</div>

<button class="btn btn-primary">Recommend</button>
</form>

<div id="loader" class="loader mt-3"></div>

{% if recommendations %}

<h4 class="mt-5">Recommended Courses</h4>

<div class="row">

{% for course in recommendations %}

<div class="col-md-4 mt-3">

<div class="card shadow">

<img src="{{ course['Image'] }}" class="card-img-top p-3" height="150">

<div class="card-body">
<h5>{{ course["Course Name"] }}</h5>
<p>{{ course["Category"] }} | {{ course["Level"] }}</p>
</div>

</div>

</div>

{% endfor %}

</div>

{% endif %}

</div>

</body>
</html>
